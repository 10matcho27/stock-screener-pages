<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-3+Nb++qF8gom4mA2mlvqZ+HQ1JHu4wft23jU92O79EI=' 'sha256-kOSDJssIeYTRvgkkm6A5dnSUcMvELvtOSAN17DtQxdI='; base-uri 'none'; form-action 'none'"><meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>暴落株（crash）</title>
<style>
/* スクロールのアンカーは使わない。描き直しの途中で Chrome がアンカーを選び直し、画面が跳ねるため（押した場所は JS で保つ） */
html, body { margin: 0; background: #f4f3ef; overflow-anchor: none; }
/* カードで html を止めてスクロールバーが消えても幅を変えない（幅が変わると描き直しで開く動きが切れる） */
html { scrollbar-gutter: stable; }
@media (prefers-color-scheme: dark) { html, body { background: #111110; } }
/* ===== crash（暴落株）の画面。scan_view.html を写して直したもの ===== */
/* 色の変数。今の画面の --fg --bg --muted --line --accent --ok --warn --bad --soft を引き継ぐ */
.crash-root{
  color-scheme: light;
  --bg:#f4f3ef; --surface:#ffffff; --fg:#1b1a18; --fg2:#46443f; --muted:#64625d;
  --line:#e3e1db; --line2:#cfccc4; --soft:#efeee9; --soft2:#e6e4de;
  --accent:#1f5fc4; --ok:#1c7a3c;
  --warn:#8a5200; --warn-bg:#fff4d9; --warn-line:#e7b54a; --hype:#e0a01e;
  --bad:#6a3bc4; --bad-bg:#f2ecff; --bad-line:#c6b2f2;
  /* 値下がり率の色（青の単色、濃いほど大きい下げ。scan の赤と同じ明るさの段階） */
  --h1:#9fbcef; --h2:#6f99e2; --h3:#3c6fcc; --h4:#24509f; --h5:#132f66;
  --e1:#7ea2e0; --e2:#3c6fcc; --e3:#24509f; --e4:#132f66; --e5:#0a1b40;
  --t1:#06142e; --t2:#06142e; --t3:#ffffff; --t4:#ffffff; --t5:#ffffff;
  --hatch:rgba(255,255,255,.62);
  /* ローソク足：陽線は赤、陰線は青 */
  --up:#c8452f; --down:#2f63b8; --up-v:#e8a091; --down-v:#9db7e0;
  --ex:#8b8881; --btn-bg:#1b1a18; --btn-fg:#ffffff;
  --shadow:0 12px 40px rgba(20,18,14,.18);
}
@media (prefers-color-scheme: dark){
  .crash-root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#111110; --surface:#1a1a19; --fg:#edece8; --fg2:#cfcdc6; --muted:#a3a19a;
    --line:#2f2e2b; --line2:#45433f; --soft:#242422; --soft2:#2c2b29;
    --accent:#7aa8ff; --ok:#4cc06d;
    --warn:#f2b84b; --warn-bg:#2b2312; --warn-line:#7a5a1c; --hype:#d0952a;
    --bad:#b99cff; --bad-bg:#231c33; --bad-line:#55408a;
    --h1:#2c4a85; --h2:#3159a8; --h3:#4475d6; --h4:#5f93f0; --h5:#9cbfff;
    --e1:#3d5ea3; --e2:#4669c4; --e3:#5c8bef; --e4:#86adff; --e5:#c0d6ff;
    --t1:#eef3ff; --t2:#eef3ff; --t3:#020a1c; --t4:#020a1c; --t5:#020a1c;
    --hatch:rgba(26,26,25,.58);
    --up:#f06a4e; --down:#6f9ff0; --up-v:#8a3a2f; --down-v:#34507e;
    --ex:#86847d; --btn-bg:#edece8; --btn-fg:#141413;
    --shadow:0 12px 40px rgba(0,0,0,.55);
  }
}
.crash-root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#111110; --surface:#1a1a19; --fg:#edece8; --fg2:#cfcdc6; --muted:#a3a19a;
  --line:#2f2e2b; --line2:#45433f; --soft:#242422; --soft2:#2c2b29;
  --accent:#7aa8ff; --ok:#4cc06d;
  --warn:#f2b84b; --warn-bg:#2b2312; --warn-line:#7a5a1c; --hype:#d0952a;
  --bad:#b99cff; --bad-bg:#231c33; --bad-line:#55408a;
  --h1:#2c4a85; --h2:#3159a8; --h3:#4475d6; --h4:#5f93f0; --h5:#9cbfff;
  --e1:#3d5ea3; --e2:#4669c4; --e3:#5c8bef; --e4:#86adff; --e5:#c0d6ff;
  --t1:#eef3ff; --t2:#eef3ff; --t3:#020a1c; --t4:#020a1c; --t5:#020a1c;
  --hatch:rgba(26,26,25,.58);
  --up:#f06a4e; --down:#6f9ff0; --up-v:#8a3a2f; --down-v:#34507e;
  --ex:#86847d; --btn-bg:#edece8; --btn-fg:#141413;
  --shadow:0 12px 40px rgba(0,0,0,.55);
}

.crash-root{
  container: crash / inline-size;
  font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  font-size:14px; line-height:1.5; color:var(--fg); background:var(--bg);
  min-height:100vh; -webkit-text-size-adjust:100%; text-size-adjust:100%;
}
.crash-root *, .crash-root *::before, .crash-root *::after{ box-sizing:border-box }
.crash-root button{ font:inherit; color:inherit }
.crash-root a{ color:inherit }
.crash-root :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px }
.crash-root .num{ font-variant-numeric: tabular-nums }
.crash-root .ic{ flex:none; display:block }
.sc-vh{ position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap }

.sc-wrap{ max-width:1100px; margin:0 auto; padding:16px 16px 56px; display:flex; flex-direction:column; gap:16px }
.sc-sec{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; min-width:0 }
.sc-sec > h2, .sc-h2{ margin:0; font-size:16px; line-height:1.35; font-weight:700; letter-spacing:.01em }
.sc-sub{ margin:2px 0 0; color:var(--muted); font-size:12.5px }
.sc-head{ display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:10px 16px; margin-bottom:12px }
.sc-head > div:first-child{ min-width:0 }
@container crash (max-width: 520px){
  .sc-wrap{ padding:10px 10px 48px; gap:12px }
  .sc-sec{ padding:12px; border-radius:12px }
}

/* ボタン */
.sc-btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:44px; padding:0 14px;
  border:1px solid var(--line2); border-radius:10px; background:var(--surface); font-weight:600; font-size:13.5px;
  cursor:pointer; text-decoration:none; white-space:nowrap }
.sc-btn:hover{ background:var(--soft) }
.sc-btn.ink{ background:var(--btn-bg); color:var(--btn-fg); border-color:var(--btn-bg) }
.sc-btn.ink:hover{ filter:brightness(1.15); background:var(--btn-bg) }
.sc-btn.sm{ min-height:44px; padding:0 11px; font-size:12.5px }
/* 切り替えのボタン（除外を隠す）。押している間は黒く塗る */
.sc-btn.tg .ic{ color:var(--muted) }
.sc-btn.tg[aria-pressed="true"]{ background:var(--btn-bg); color:var(--btn-fg); border-color:var(--btn-bg) }
.sc-btn.tg[aria-pressed="true"] .ic{ color:inherit }
.sc-btn.tg[aria-pressed="true"]:hover{ filter:brightness(1.15) }
.sc-seg{ display:inline-flex; background:var(--soft); border:1px solid var(--line); border-radius:12px; padding:2px; gap:2px; max-width:100% }
.sc-seg button{ min-height:44px; padding:0 14px; border:0; background:transparent; border-radius:10px; font-weight:600; font-size:13px; color:var(--fg2); cursor:pointer; white-space:nowrap }
.sc-seg button[aria-pressed="true"]{ background:var(--surface); color:var(--fg); box-shadow:0 1px 2px rgba(0,0,0,.12), 0 0 0 1px var(--line2) }
.sc-seg button:hover:not([aria-pressed="true"]){ color:var(--fg) }

/* 印 */
.sc-tag{ display:inline-flex; align-items:center; gap:3px; height:20px; padding:0 6px; border-radius:6px; font-size:11px; font-weight:700; line-height:1; white-space:nowrap; background:var(--soft2); color:var(--fg2) }
.sc-tag.s{ background:var(--fg); color:var(--surface) }
.sc-tag.sn{ background:transparent; box-shadow:inset 0 0 0 1px var(--line2); color:var(--fg2) }
.sc-tag.warn{ background:var(--warn-bg); color:var(--warn); box-shadow:inset 0 0 0 1px var(--warn-line) }
.sc-tag.bad{ background:var(--bad-bg); color:var(--bad); box-shadow:inset 0 0 0 1px var(--bad-line) }

/* 値下がり率の色見本 */
.sc-legend{ display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; font-size:12px; color:var(--fg2) }
.sc-legend .it{ display:inline-flex; align-items:center; gap:5px; white-space:nowrap }
.sc-ramp{ display:inline-flex; align-items:flex-start; gap:8px }
.sc-ramp > span:first-child{ line-height:12px; padding-top:1px }
.sc-ramp .sw{ display:flex; gap:2px }
.sc-ramp .sw i{ display:block; width:42px; height:12px; border-radius:2px }
.sc-ramp .lb{ display:flex; gap:2px; font-size:10.5px; color:var(--muted); line-height:1.3; margin-top:2px; font-variant-numeric:tabular-nums }
.sc-ramp .lb span{ width:42px; text-align:center; white-space:nowrap }
.sc-rampbox{ display:flex; flex-direction:column; gap:2px }
.b0bg{ background:var(--h1) } .b1bg{ background:var(--h2) } .b2bg{ background:var(--h3) } .b3bg{ background:var(--h4) } .b4bg{ background:var(--h5) }
.hatchbg{ background-color:var(--h3); background-image:repeating-linear-gradient(135deg, var(--hatch) 0 2px, transparent 2px 5px) }

/* ===== 概要の帯 ===== */
.sc-band{ display:grid; grid-template-columns: minmax(0,1fr) minmax(300px, 440px); gap:16px 28px; align-items:center }
@container crash (max-width: 760px){ .sc-band{ grid-template-columns: minmax(0,1fr) } }
.sc-kicker{ margin:0; font-size:12px; font-weight:700; color:var(--muted); letter-spacing:.06em }
.sc-date{ margin:2px 0 4px; font-size:24px; line-height:1.25; font-weight:750 }
.sc-date small{ font-size:14px; font-weight:600; color:var(--muted); margin-left:6px }
.sc-meta{ display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center; color:var(--fg2); font-size:13px }
.sc-meta .dot{ color:var(--line2) }
.sc-funnel{ display:grid; grid-template-columns: auto minmax(0,1fr) auto; gap:5px 10px; align-items:center; font-size:12.5px }
.sc-funnel .lb{ color:var(--fg2); white-space:nowrap }
.sc-funnel .tr{ height:8px; border-radius:4px; background:var(--soft); overflow:hidden }
.sc-funnel .tr i{ display:block; height:100%; border-radius:0 4px 4px 0 }
.sc-funnel .v{ font-size:15px; font-weight:700; text-align:right; min-width:2.6em }
.sc-funnel .f0 i{ background:var(--line2) } .sc-funnel .f2 i{ background:var(--fg) }
.sc-funnel .ft{ grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:4px 12px; color:var(--muted); font-size:12px; margin-top:2px }
.sc-funnel .ft a{ color:var(--fg2); text-underline-offset:2px }
.sc-warns{ display:flex; flex-direction:column; gap:8px; margin-top:14px }
.sc-warn{ display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border-radius:10px; background:var(--warn-bg); border:1px solid var(--warn-line); color:var(--fg); font-size:13.5px }
.sc-warn .ic{ color:var(--warn); margin-top:2px }
.sc-warn b{ color:var(--warn); margin-right:6px }

/* 絞り込み中の帯 */
.sc-selbar{ position:sticky; top:0; z-index:30; margin:0; padding:8px 16px; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-bottom:1px solid var(--line) }
.sc-selbar[hidden]{ display:none }
.sc-selbar .in{ max-width:1100px; margin:0 auto; display:flex; align-items:center; gap:10px; flex-wrap:wrap }
.sc-selbar .lb{ font-size:12px; color:var(--muted); font-weight:700 }
.sc-selbar .path{ font-weight:700; font-size:14px; min-width:0; display:flex; align-items:center; gap:4px; flex-wrap:wrap }
.sc-selbar .path .ic{ color:var(--muted) }
.sc-selbar .cnt{ font-size:12.5px; color:var(--fg2) }
.sc-selbar .sp{ flex:1 }
@container crash (max-width: 520px){ .sc-selbar{ padding:6px 10px } .sc-selbar .in{ gap:4px 10px } }

/* ===== 散布図 ===== */
.sp-wrap{ position:relative }
.sp-svg{ display:block; width:100%; height:auto; touch-action:manipulation; user-select:none; -webkit-user-select:none }
.sp-svg .grid line{ stroke:var(--line); stroke-width:1 }
.sp-svg .ax text{ fill:var(--muted); font-size:11px; font-variant-numeric:tabular-nums }
.sp-svg .ax .ttl{ fill:var(--fg2); font-size:11.5px; font-weight:600 }
.sp-svg .thr line{ stroke:var(--fg2); stroke-width:1.2; stroke-dasharray:5 4; opacity:.75 }
.sp-svg .thr text{ fill:var(--fg2); font-size:10.5px; font-weight:600; paint-order:stroke; stroke:var(--surface); stroke-width:3px; stroke-linejoin:round }
.sp-svg .pt{ transition:opacity .15s }
.sp-svg .pt.c{ stroke-width:1.25 }
.sp-svg .pt.c.b0{ fill:var(--h1); stroke:var(--e1) } .sp-svg .pt.c.b1{ fill:var(--h2); stroke:var(--e2) }
.sp-svg .pt.c.b2{ fill:var(--h3); stroke:var(--e3) } .sp-svg .pt.c.b3{ fill:var(--h4); stroke:var(--e4) }
.sp-svg .pt.c.b4{ fill:var(--h5); stroke:var(--e5) }
.sp-svg .pt.x{ fill:none; stroke:var(--ex); stroke-width:1.3; opacity:.72 }
.sp-svg .pt.dim, .sp-svg .smk.dim{ opacity:.09 }
.sp-svg .smk{ font-size:9.5px; font-weight:800; fill:var(--fg); paint-order:stroke; stroke:var(--surface); stroke-width:2.6px; stroke-linejoin:round; pointer-events:none }
.sp-svg .lbl{ font-size:11px; font-weight:600; fill:var(--fg); paint-order:stroke; stroke:var(--surface); stroke-width:3.2px; stroke-linejoin:round; pointer-events:none }
.sp-svg .hov{ fill:none; stroke:var(--fg); stroke-width:1.5; pointer-events:none }
.sp-svg .onr{ fill:none; stroke:var(--accent); stroke-width:2.5; pointer-events:none }
.sp-svg .hit{ fill:transparent; cursor:pointer }
.sp-leg{ display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center; font-size:12px; color:var(--fg2); margin:0 0 10px }
.sp-leg .it{ display:inline-flex; align-items:center; gap:5px; white-space:nowrap }
.sp-leg svg{ display:block; overflow:visible }
.sp-leg .g{ display:inline-flex; gap:12px; flex-wrap:wrap }
.sp-note{ margin:8px 0 0; font-size:12px; color:var(--muted) }

/* 吹き出し */
.sc-tip{ position:fixed; z-index:80; pointer-events:none; max-width:260px; padding:8px 10px; border-radius:10px; background:var(--surface); border:1px solid var(--line2); box-shadow:var(--shadow); font-size:12px; line-height:1.45 }
.sc-tip[hidden]{ display:none }
.sc-tip .t{ font-weight:700; font-size:13px }
.sc-tip .m{ color:var(--muted) }
.sc-tip .r{ display:flex; gap:10px; flex-wrap:wrap; margin-top:3px; font-variant-numeric:tabular-nums }
.sc-tip .r b{ font-size:13px }

/* ===== ヒートマップ ===== */
.hm-ctrl{ display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:space-between; margin-bottom:12px }
.hm-tg{ display:flex; flex-wrap:wrap; gap:8px 10px; align-items:center; max-width:100% }
.hm-body{ position:relative }
.tm{ position:relative; width:100% }
.tm-g{ position:absolute; background:var(--soft); border-radius:8px; overflow:hidden }
.tm-g.sel{ box-shadow:inset 0 0 0 2px var(--fg) }
.tm-g.other, .hr.other{ background:transparent; box-shadow:inset 0 0 0 1.5px var(--line2) }
.tm-g.other .tm-gn, .hr.other .tm-gn{ color:var(--fg2) }
.tm-g.other.sel, .hr.other.sel{ box-shadow:inset 0 0 0 2px var(--fg) }
.tm-gh{ position:absolute; left:0; top:0; right:0; height:44px; display:flex; align-items:center; gap:6px; padding:4px 6px 4px 9px; border:0; background:transparent; text-align:left; cursor:pointer; min-width:0 }
.tm-gh:hover{ background:var(--soft2) }
.tm-gh .tx{ display:flex; flex-direction:column; min-width:0; flex:1 }
.tm-gn{ font-weight:700; font-size:12.5px; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.tm-gs{ font-size:11px; line-height:1.3; color:var(--fg2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums }
.tm-gh .ic{ color:var(--muted) }
.crash-root .tm-t{ position:absolute; margin:0; padding:3px 4px 2px; border:0; border-radius:3px; cursor:pointer; overflow:hidden; text-align:left;
  display:flex; flex-direction:column; justify-content:flex-start; color:var(--tc); line-height:1.2; transition:opacity .15s }
.tm-t.b0{ background-color:var(--h1); --tc:var(--t1) } .tm-t.b1{ background-color:var(--h2); --tc:var(--t2) }
.tm-t.b2{ background-color:var(--h3); --tc:var(--t3) } .tm-t.b3{ background-color:var(--h4); --tc:var(--t4) }
.tm-t.b4{ background-color:var(--h5); --tc:var(--t5) }
.tm-t.ex{ background-image:repeating-linear-gradient(135deg, var(--hatch) 0 2px, transparent 2px 5px) }
.tm-t .n{ display:block; font-size:11px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100% }
.tm-t .r{ display:block; font-size:10.5px; font-weight:600; white-space:nowrap; overflow:hidden; font-variant-numeric:tabular-nums; opacity:.92 }
.tm-t.ex .n, .tm-t.ex .r{ text-shadow:0 0 3px var(--hcs, transparent) }
.tm-t .sbg{ position:absolute; right:2px; top:2px; width:14px; height:14px; border-radius:3px; background:var(--fg); color:var(--surface); font-size:10px; font-weight:800; line-height:14px; text-align:center }
.tm-t.has-s .n{ padding-right:14px }
.tm-t.dim{ opacity:.16 }
.tm-t.on{ outline:2.5px solid var(--accent); outline-offset:-2.5px; z-index:3 }
.tm-t:hover{ filter:saturate(1.15) brightness(1.04); z-index:2 }
.tm-t:focus-visible{ outline:2.5px solid var(--accent); outline-offset:-2.5px; z-index:4; border-radius:3px }

/* スマホ：業種を縦に並べる */
.hr-list{ display:flex; flex-direction:column; gap:10px }
.hr{ background:var(--soft); border-radius:10px; overflow:hidden }
.hr.sel{ box-shadow:inset 0 0 0 2px var(--fg) }
.hr-h{ display:flex; align-items:center; gap:8px; width:100%; min-height:44px; padding:4px 8px 4px 10px; border:0; background:transparent; text-align:left; cursor:pointer }
.hr-h:hover{ background:var(--soft2) }
.hr-h .tx{ flex:1; min-width:0; display:flex; align-items:baseline; gap:2px 8px; flex-wrap:wrap }
.hr-h .tm-gn{ font-size:13.5px }
.hr-h .tm-gs{ font-size:11.5px }
.hr-h .ic{ color:var(--muted) }
.hr-b{ position:relative; margin:0 3px 3px }

/* 深掘り */
.dr-top{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px }
.dr-top h3{ margin:0; font-size:18px; line-height:1.3 }
.dr-top p{ margin:0; font-size:12.5px; color:var(--fg2) }
.dr-sec-t{ display:flex; flex-wrap:wrap; gap:2px 10px; align-items:baseline; margin:0 0 6px }
.dr-sec-t h4{ margin:0; font-size:13.5px }
.dr-sec-t span{ font-size:12px; color:var(--muted) }
.br-list{ display:flex; flex-direction:column; gap:2px; margin-bottom:18px }
.br{ display:grid; grid-template-columns: minmax(110px, 180px) minmax(0,1fr) 46px 84px 92px; align-items:center; gap:4px 10px;
  width:100%; min-height:44px; padding:4px 8px; border:0; border-radius:8px; background:transparent; text-align:left; cursor:pointer }
.br:hover{ background:var(--soft) }
.br[aria-pressed="true"]{ background:var(--soft); box-shadow:inset 0 0 0 2px var(--fg) }
.br .n{ font-weight:650; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.br .bar{ height:14px; background:var(--soft2); border-radius:3px; overflow:hidden }
.br .bar i{ display:block; height:100%; border-radius:0 4px 4px 0 }
.br .c{ text-align:right; font-weight:700; font-size:13px }
.br .a{ display:flex; align-items:center; gap:5px; justify-content:flex-end; font-size:12.5px; font-weight:600 }
.br .a i{ width:10px; height:10px; border-radius:2px; flex:none }
.br .s{ text-align:right; font-size:12.5px; color:var(--fg2) }
.br-head{ display:grid; grid-template-columns: minmax(110px, 180px) minmax(0,1fr) 46px 84px 92px; gap:10px; padding:0 8px; font-size:11px; color:var(--muted) }
.br-head span:nth-child(n+3){ text-align:right }
@container crash (max-width: 640px){

.sp-svg .gh, .sp-svg .gh-ax{ pointer-events:none }

/* ===== 動き =====
 * transform と opacity だけを動かす。最初の表示と押したときだけ（JS がクラスを付ける）。
 * 動きを減らす設定では何も動かさない（下の no-preference の中にだけ書く）。どれも止まった形が最後の形になる */
@keyframes fadeIn{ from{ opacity:0 } }
@keyframes fadeOut{ to{ opacity:0 } }
@keyframes growX{ from{ transform:scaleX(0) } }
@keyframes growY{ from{ transform:scaleY(0); opacity:0 } }
@keyframes ptIn{ from{ transform:scale(0); opacity:0 } }
@keyframes ptDim{ from{ opacity:1 } }
@keyframes ptDimX{ from{ opacity:.72 } }
@keyframes ptLit{ from{ opacity:.09 } }
@keyframes hmIn{ from{ transform:scale(.96); opacity:0 } }
@keyframes zIn{ from{ transform:scale(.9); opacity:0 } }
@keyframes zOut{ from{ transform:scale(1.05); opacity:0 } }
@keyframes tbIn{ from{ opacity:.25 } }
@keyframes cdUp{ from{ transform:translateY(100%) } }
@keyframes cdDown{ to{ transform:translateY(100%) } }
@keyframes cdIn{ from{ transform:translateX(24px); opacity:.6 } }
@keyframes cdOut{ to{ transform:translateX(24px); opacity:0 } }
@keyframes cdSwap{ from{ opacity:.4 } }
@keyframes ckPop{ 0%{ transform:scale(0); opacity:0 } 60%{ transform:scale(1.25); opacity:1 } 100%{ transform:none; opacity:1 } }
@keyframes icPop{ from{ transform:scale(.72) } }
@media (prefers-reduced-motion: no-preference){
  /* 拡大して入る動きで横にはみ出しても、画面を横に動かさない（clip はスクロールの箱を作らないので sticky は効く） */
  .crash-root{ overflow-x:clip }

  /* 押したとき：少し縮む */
  .crash-root .sc-btn, .crash-root .sc-seg button, .crash-root .br, .crash-root .ex-b, .crash-root .cd-chip, .crash-root .cd-x,
  .crash-root .tm-gh, .crash-root .hr-h, .crash-root .lr, .crash-root .xr{ transition:transform 80ms ease-out }
  .crash-root .tm-t{ transition:opacity .15s, transform 80ms ease-out }
  .crash-root .sc-btn:active, .crash-root .sc-seg button:active, .crash-root .br:active, .crash-root .ex-b:active, .crash-root .cd-chip:active,
  .crash-root .cd-x:active, .crash-root .tm-gh:active, .crash-root .hr-h:active, .crash-root .tm-t:active{ transform:scale(.97) }
  /* 一覧の行は、行全体を押すボタン（.hit）のときだけ（掲示板のリンクを押したときは縮めない） */
  .crash-root .lr:has(> .hit:active), .crash-root .xr:has(> .hit:active){ transform:scale(.97) }

  /* 除外を隠す：チェックが弾んで出る。外したときは箱が少し弾む */
  .sc-btn.tg .ck{ transform-box:fill-box; transform-origin:center }
  .sc-btn.tg.pop .ck{ animation:ckPop .28s ease-out }
  .sc-btn.tg.pop[aria-pressed="false"] .ic{ animation:icPop .2s ease-out }

  /* 棒：0 から伸びる（.gx は左から、SVG の点の帯は 0 の線から。.gy は下から上へ） */
  .gx{ transform-origin:left center }
  .mo-in .gx{ animation:growX .4s cubic-bezier(.2,.7,.3,1) var(--gd, 0ms) backwards }
  .mo-in .gy{ animation:growY .36s cubic-bezier(.2,.7,.3,1) var(--gd, 0ms) backwards }

  /* 散布図：最初は点が順位の順に育つ。描き直すときは前の位置から動き、消える点は薄れ、出る点は育つ */
  .sp-svg .pt, .sp-svg .smk{ transform-box:fill-box; transform-origin:center; transition:opacity .15s, transform .4s cubic-bezier(.2,.7,.3,1) }
  .sp-svg.mo-in .pt{ animation:ptIn .34s cubic-bezier(.2,.8,.3,1.15) backwards }
  .sp-svg.mo-in .smk, .sp-svg.mo-in .lbl{ animation:fadeIn .3s ease-out .26s backwards }
  .sp-svg .pin{ animation:ptIn .3s ease-out .12s backwards }
  .sp-svg .gh, .sp-svg .gh-ax{ animation:fadeOut .2s ease-in forwards }
  .sp-svg .fin{ animation:fadeIn .3s ease-out .12s backwards }
  .sp-svg .lin{ animation:fadeIn .25s ease-out .3s backwards }
  .sp-svg .pt.dch.dim{ animation:ptDim .3s ease-in }
  .sp-svg .pt.x.dch.dim{ animation-name:ptDimX }
  .sp-svg .pt.dch:not(.dim){ animation:ptLit .3s ease-out }

  /* ヒートマップ：枠ごとに順に出る。深掘りは押した見出しから拡大、戻るは縮小。除外を隠すと枠が新しい位置へ動く */
  .hm-body.mo-in .tm-g, .hm-body.mo-in .hr{ animation:hmIn .32s cubic-bezier(.2,.7,.3,1) var(--gd, 0ms) backwards }
  .hm-body.mo-zin{ animation:zIn .34s cubic-bezier(.2,.7,.3,1) }
  .hm-body.mo-zout{ animation:zOut .34s cubic-bezier(.2,.7,.3,1) }
  .hm-body.mo-swap .tb{ animation:tbIn .28s ease-out backwards }
  .hm-body.mo-swap .gin{ animation:hmIn .3s ease-out .08s backwards }
  .hm-body.mo-fl [data-gk]{ transition:transform .38s cubic-bezier(.2,.7,.3,1) }

  /* 銘柄カード：スマホは下から滑り出て、閉じるときは下へ。幕は薄く出て薄く消える */
  .cd-layer.opening .cd{ animation:cdUp .3s cubic-bezier(.2,.8,.2,1) }
  .cd-layer.opening .cd-scrim{ animation:fadeIn .25s ease-out }
  .cd-layer.opening .cd-body{ --gd:120ms }
  .cd-layer.swap .cd{ animation:cdSwap .18s ease-out }
  .cd-layer.out .cd{ animation:cdDown .24s ease-in forwards }
  .cd-layer.out .cd-scrim{ animation:fadeOut .24s ease-in forwards }
}
@media (min-width: 900px) and (prefers-reduced-motion: no-preference){
  /* PC の横の板は、今までどおり右から少し滑って出る */
  .cd-layer.opening .cd{ animation:cdIn .18s ease-out }
  .cd-layer.opening .cd-body{ --gd:0ms }
  .cd-layer.out .cd{ animation:cdOut .18s ease-in forwards }
}
@media (prefers-reduced-motion: reduce){
  .crash-root *, .crash-root *::before, .crash-root *::after{ animation:none !important; transition:none !important }
}

/* ===== 上の案内（サーバーが足す。.crash-root の外なので色は自前で持つ） ===== */
.site-nav{
  display:flex; flex-wrap:wrap; align-items:center; gap:4px 16px;

        else if (keepList) dy = secLs.getBoundingClientRect().top - l0;
        else {
          var lim = selbar.hidden ? 0 : Math.max(0, selbar.getBoundingClientRect().bottom);
          dy = secHm.getBoundingClientRect().top - (h0 < lim ? lim : h0);
        }
        if (Math.abs(dy) >= 1) global.scrollBy(0, dy);
        if (again && focused) again.focus({ preventScroll: true });
      }
      if (snap) jobs.unshift(function () { playHeat(kind, snap, from); });
      jobs.forEach(function (job) {
        try { job(); } catch (e) { if (global.console) global.console.warn('crash: 動きを付けられませんでした', e); }
      });
      return again;
    }
    function centerOf(el) {
      if (!el) return null;
      var r = el.getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    }
    // 描き直す前のヒートマップ：除外を隠すときは枠の位置、深掘りに入るときは押した見出しの中心（画面の座標）
    function snapHeat(kind, trigger) {
      var s = { groups: null, origin: null };
      if (kind === 'hide') {
        s.groups = new Map();
        secHm.querySelectorAll('[data-gk]').forEach(function (e) {
          var r = e.getBoundingClientRect();
          s.groups.set(e.getAttribute('data-gk'), { x: r.left, y: r.top });
        });
      } else if (kind === 'sel' && trigger && secHm.contains(trigger)) s.origin = centerOf(trigger);
      return s;
    }
    // 深掘り：押した見出しの場所（指の下）から拡大して入る。戻る：前に見ていた枠の見出しから縮小して入る。
    // 除外を隠す：残った枠は前の位置から今の位置へ動き、タイルは薄い状態から濃くなる
    function playHeat(kind, snap, from) {
      var body = secHm.querySelector('.hm-body');
      if (!body) return;
      if (kind === 'sel' || kind === 'back') {
        var o = kind === 'sel' ? snap.origin : centerOf(anchorOf('ov:' + pickKey(from)));
        var br = body.getBoundingClientRect();
        var ox = o ? o.x - br.left : br.width / 2, oy = o ? o.y - br.top : 0;
        body.style.transformOrigin = Math.round(ox) + 'px ' + Math.round(oy) + 'px';
        body.classList.add(kind === 'sel' ? 'mo-zin' : 'mo-zout');
        return;
      }
      if (kind !== 'hide' || !snap.groups) return;
      // 先に全部の位置を読み、そのあとでまとめて書く（読み書きを交互にすると、枠ごとにレイアウトが走る）
      var plan = [];
      body.querySelectorAll('[data-gk]').forEach(function (e) {
        var p = snap.groups.get(e.getAttribute('data-gk'));
        var r = p ? e.getBoundingClientRect() : null;
        plan.push({ e: e, dx: p ? p.x - r.left : 0, dy: p ? p.y - r.top : 0, isNew: !p });
      });
      var moved = [];
      plan.forEach(function (it) {
        if (it.isNew) { it.e.classList.add('gin'); return; }
        if (Math.abs(it.dx) < 1 && Math.abs(it.dy) < 1) return;
        it.e.style.transform = 'translate(' + it.dx.toFixed(1) + 'px,' + it.dy.toFixed(1) + 'px)';
        moved.push(it.e);
      });
      body.classList.add('mo-swap');
      if (!moved.length) return;
      void body.offsetWidth;  // 前の位置を一度確定させてから外す（transition で今の位置へ動く）
      body.classList.add('mo-fl');
      moved.forEach(function (e) { e.style.removeProperty('transform'); });
    }
    function select(sel, trigger) {
      var from = st.sel;
      act(sel ? 'sel' : 'back', trigger || null, function () {
        st.sel = sel;
        hideTip();
        renderSelbar(); renderScatter(); renderHeat(); renderList(); markOn();
      }, from);
      if (trigger) return;
      var r = secHm.getBoundingClientRect();
      if (sel && r.top < 0) secHm.scrollIntoView({ block: 'start' });
    }
    function setSub(pick, trigger) {
      if (!st.sel) return;
      act('sub', trigger || null, function () {
        var next = Object.assign({}, st.sel);
        next.sub = samePick(st.sel.sub, pick) ? null : pick;
        st.sel = next;
        renderSelbar(); renderScatter(); renderHeat(); renderList(); markOn();
      });
    }
    function setHideEx(on, where, trigger) {
      var again = act('hide', trigger || null, function () {
        st.hideEx = on;
        saveHideEx(on);
        // 隠したことで深掘りの中の選択（テーマの棒など）に入る銘柄がなくなったら、その選択だけ外す
        if (on && st.sel && st.sel.sub && !visHeat().some(selPred(st.sel))) {
          var next = Object.assign({}, st.sel);
          next.sub = null;
          st.sel = next;
        }
        hideTip();
        renderSelbar(); renderScatter(); renderHeat(); renderList(); markOn();
      });
      // 押したボタンは描き直しで作り直されるので、同じ場所のボタンに戻す
      if (!again) again = root.querySelector('[data-hide-ex="' + where + '"]');
      if (again) again.focus({ preventScroll: true });
    }
    function renderCharts() { renderScatter(); renderHeat(); markOn(); }
    function onKey(e) { if (e.key === 'Escape' && st.card != null) closeCard(); }
    document.addEventListener('keydown', onKey);

    // 初めの状態（アドレスの # から。銘柄カードを直接開くリンクにも使う）。深掘りは描く前に決め、1回だけ描く
    if (opts.drill) {
      var d0 = M.heat.some(function (s) { return s.industry === opts.drill; }) ? { kind: 'industry', name: opts.drill }
        : M.heat.some(function (s) { return s.themes.indexOf(opts.drill) >= 0; }) ? { kind: 'theme', name: opts.drill } : null;
      st.sel = d0 && opts.sub ? Object.assign({}, d0, { sub: { kind: 'theme', name: opts.sub } }) : d0;
    }
    act('load', null, function () { renderBand(); renderSelbar(); renderScatter(); renderHeat(); renderList(); renderExcluded(); });
    W = root.clientWidth;
    var raf = 0;
    var ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(function () {
      var w = root.clientWidth;
      if (Math.abs(w - W) < 2) return;
      W = w; cancelAnimationFrame(raf);
      raf = requestAnimationFrame(function () { renderCharts(); if (st.card != null) renderCard(true); });
    }) : null;
    if (ro) ro.observe(root);

    if (opts.card) {
      var cs = M.stocks.filter(function (s) { return s.code === String(opts.card); })[0];
      if (cs) openCard(cs, null, true);
      // cardScroll: forum → 掲示板、score（scan と同じ名前）か signals → 材料の表、ほか → 株価
      var target = opts.cardScroll && layer.querySelector(opts.cardScroll === 'forum' ? '.cd-fm' : (opts.cardScroll === 'score' || opts.cardScroll === 'signals') ? '.cd-sig' : '.cd-chart');
      var cb = layer.querySelector('.cd-body');
      if (target && cb) cb.scrollTop = target.offsetTop - cb.offsetTop - 8;
    }
    return {
      destroy: function () { if (ro) ro.disconnect(); document.removeEventListener('keydown', onKey); closing++; lockScroll(false); host.textContent = ''; },
      select: select, openCard: function (code) { var x = M.stocks.filter(function (s) { return s.code === String(code); })[0]; if (x) openCard(x, null); }
    };
  }

  global.CrashScreen = { mount: mount };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
(function () {
  // アドレスの # で初めの状態を開ける。銘柄カードを直接開くリンクにも使う
  // （例 #theme=dark&view=theme&drill=情報・通信業&sub=情報セキュリティ&card=4461&cardScroll=score&ex=open）
  var q = {};
  location.hash.replace(/^#/, '').split('&').forEach(function (kv) {
    if (!kv) return;
    var i = kv.indexOf('='), k = i < 0 ? kv : kv.slice(0, i), v = i < 0 ? '' : kv.slice(i + 1);
    try { q[decodeURIComponent(k)] = decodeURIComponent(v); } catch (e) { q[k] = v; }
  });
  if (q.theme === 'dark') document.documentElement.style.background = document.body.style.background = '#111110';
  if (q.theme === 'light') document.documentElement.style.background = document.body.style.background = '#f4f3ef';
  var data = JSON.parse(document.getElementById('crash-data').textContent);
  CrashScreen.mount(document.getElementById('app'), data, {
    theme: q.theme, view: q.view, drill: q.drill, sub: q.sub, card: q.card, cardScroll: q.cardScroll, exOpen: q.ex === 'open'
  });
  window.addEventListener('hashchange', function () { location.reload(); });
})();
</script>
