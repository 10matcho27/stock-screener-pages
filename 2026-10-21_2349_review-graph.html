<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-maS653UML27GetLsRo4M8/Ywkaa3UpnP70u7UBgcgp0='; base-uri 'none'; form-action 'none'"><meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>review 結果</title>
<style>

/* スクロールのアンカーは使わない。描き直しの途中で Chrome がアンカーを選び直し、画面が跳ねるため（押した場所は JS で保つ） */
html, body { margin: 0; background: #f4f3ef; overflow-anchor: none; }
/* カードで html を止めてスクロールバーが消えても幅を変えない（幅が変わると描き直しで開く動きが切れる） */
html { scrollbar-gutter: stable; }
@media (prefers-color-scheme: dark) { html, body { background: #111110; } }
/* ===== scan 結果画面 ===== */
/* 色の変数。今の画面の --fg --bg --muted --line --accent --ok --warn --bad --soft を引き継ぐ */
.scan-root{
  color-scheme: light;
  --bg:#f4f3ef; --surface:#ffffff; --fg:#1b1a18; --fg2:#46443f; --muted:#64625d;
  --line:#e3e1db; --line2:#cfccc4; --soft:#efeee9; --soft2:#e6e4de;
  --accent:#1f5fc4; --ok:#1c7a3c;
  --warn:#8a5200; --warn-bg:#fff4d9; --warn-line:#e7b54a; --hype:#e0a01e;
  --bad:#6a3bc4; --bad-bg:#f2ecff; --bad-line:#c6b2f2;
  /* 上昇率の色（赤の単色、濃いほど強い） */
  --h1:#f09e8d; --h2:#e3735f; --h3:#c8452f; --h4:#a12a1d; --h5:#6e170f;
  --e1:#d97a68; --e2:#c8452f; --e3:#a12a1d; --e4:#6e170f; --e5:#450c06;
  --t1:#2a0a05; --t2:#2a0a05; --t3:#ffffff; --t4:#ffffff; --t5:#ffffff;
  --hatch:rgba(255,255,255,.62);
  /* ローソク足：陽線は赤、陰線は青 */
  --up:#c8452f; --down:#2f63b8; --up-v:#e8a091; --down-v:#9db7e0;
  /* 点の内訳 B1〜B5（検証済みの並び） */
  --b1:#2a78d6; --b2:#1baf7a; --b3:#eda100; --b4:#6250d6; --b5:#008300;
  --ex:#8b8881; --btn-bg:#1b1a18; --btn-fg:#ffffff;
  --shadow:0 12px 40px rgba(20,18,14,.18);
}
@media (prefers-color-scheme: dark){
  .scan-root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#111110; --surface:#1a1a19; --fg:#edece8; --fg2:#cfcdc6; --muted:#a3a19a;
    --line:#2f2e2b; --line2:#45433f; --soft:#242422; --soft2:#2c2b29;
    --accent:#7aa8ff; --ok:#4cc06d;
    --warn:#f2b84b; --warn-bg:#2b2312; --warn-line:#7a5a1c; --hype:#d0952a;
    --bad:#b99cff; --bad-bg:#231c33; --bad-line:#55408a;
    --h1:#87352c; --h2:#ab3c2e; --h3:#d6523b; --h4:#f06a4e; --h5:#ffa083;
    --e1:#a8463a; --e2:#c8523f; --e3:#ef6a52; --e4:#ff9478; --e5:#ffc2ae;
    --t1:#fff1ed; --t2:#fff1ed; --t3:#1a0502; --t4:#1a0502; --t5:#1a0502;
    --hatch:rgba(26,26,25,.58);
    --up:#f06a4e; --down:#6f9ff0; --up-v:#8a3a2f; --down-v:#34507e;
    --b1:#3987e5; --b2:#199e70; --b3:#c98500; --b4:#9085e9; --b5:#008300;
    --ex:#86847d; --btn-bg:#edece8; --btn-fg:#141413;
    --shadow:0 12px 40px rgba(0,0,0,.55);
  }
}
.scan-root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#111110; --surface:#1a1a19; --fg:#edece8; --fg2:#cfcdc6; --muted:#a3a19a;
  --line:#2f2e2b; --line2:#45433f; --soft:#242422; --soft2:#2c2b29;
  --accent:#7aa8ff; --ok:#4cc06d;
  --warn:#f2b84b; --warn-bg:#2b2312; --warn-line:#7a5a1c; --hype:#d0952a;
  --bad:#b99cff; --bad-bg:#231c33; --bad-line:#55408a;
  --h1:#87352c; --h2:#ab3c2e; --h3:#d6523b; --h4:#f06a4e; --h5:#ffa083;
  --e1:#a8463a; --e2:#c8523f; --e3:#ef6a52; --e4:#ff9478; --e5:#ffc2ae;
  --t1:#fff1ed; --t2:#fff1ed; --t3:#1a0502; --t4:#1a0502; --t5:#1a0502;
  --hatch:rgba(26,26,25,.58);
  --up:#f06a4e; --down:#6f9ff0; --up-v:#8a3a2f; --down-v:#34507e;
  --b1:#3987e5; --b2:#199e70; --b3:#c98500; --b4:#9085e9; --b5:#008300;
  --ex:#86847d; --btn-bg:#edece8; --btn-fg:#141413;
  --shadow:0 12px 40px rgba(0,0,0,.55);
}

.scan-root{
  container: scan / inline-size;
  font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  font-size:14px; line-height:1.5; color:var(--fg); background:var(--bg);
  min-height:100vh; -webkit-text-size-adjust:100%; text-size-adjust:100%;
}
.scan-root *, .scan-root *::before, .scan-root *::after{ box-sizing:border-box }
.scan-root button{ font:inherit; color:inherit }
.scan-root a{ color:inherit }
.scan-root :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px }
.scan-root .num{ font-variant-numeric: tabular-nums }
.scan-root .ic{ flex:none; display:block }
.sc-vh{ position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap }

.sc-wrap{ max-width:1100px; margin:0 auto; padding:16px 16px 56px; display:flex; flex-direction:column; gap:16px }
.sc-sec{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; min-width:0 }
.sc-sec > h2, .sc-h2{ margin:0; font-size:16px; line-height:1.35; font-weight:700; letter-spacing:.01em }
.sc-sub{ margin:2px 0 0; color:var(--muted); font-size:12.5px }
.sc-head{ display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:10px 16px; margin-bottom:12px }
.sc-head > div:first-child{ min-width:0 }
@container scan (max-width: 520px){
  .sc-wrap{ padding:10px 10px 48px; gap:12px }
  .sc-sec{ padding:12px; border-radius:12px }
}

/* ボタン */
.sc-btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:44px; padding:0 14px;
  border:1px solid var(--line2); border-radius:10px; background:var(--surface); font-weight:600; font-size:13.5px;
  cursor:pointer; text-decoration:none; white-space:nowrap }
.sc-btn:hover{ background:var(--soft) }
.sc-btn.ink{ background:var(--btn-bg); color:var(--btn-fg); border-color:var(--btn-bg) }
.sc-btn.ink:hover{ filter:brightness(1.15); background:var(--btn-bg) }
.sc-btn.sm{ min-height:44px; padding:0 11px; font-size:12.5px }
/* 切り替えのボタン（除外を隠す）。押している間は黒く塗る */
.sc-btn.tg .ic{ color:var(--muted) }
.sc-btn.tg[aria-pressed="true"]{ background:var(--btn-bg); color:var(--btn-fg); border-color:var(--btn-bg) }
.sc-btn.tg[aria-pressed="true"] .ic{ color:inherit }
.sc-btn.tg[aria-pressed="true"]:hover{ filter:brightness(1.15) }
.sc-seg{ display:inline-flex; background:var(--soft); border:1px solid var(--line); border-radius:12px; padding:2px; gap:2px; max-width:100% }
.sc-seg button{ min-height:44px; padding:0 14px; border:0; background:transparent; border-radius:10px; font-weight:600; font-size:13px; color:var(--fg2); cursor:pointer; white-space:nowrap }
.sc-seg button[aria-pressed="true"]{ background:var(--surface); color:var(--fg); box-shadow:0 1px 2px rgba(0,0,0,.12), 0 0 0 1px var(--line2) }
.sc-seg button:hover:not([aria-pressed="true"]){ color:var(--fg) }

/* 印 */
.sc-tag{ display:inline-flex; align-items:center; gap:3px; height:20px; padding:0 6px; border-radius:6px; font-size:11px; font-weight:700; line-height:1; white-space:nowrap; background:var(--soft2); color:var(--fg2) }
.sc-tag.s{ background:var(--fg); color:var(--surface) }
.sc-tag.pts{ background:transparent; box-shadow:inset 0 0 0 1px var(--line2); color:var(--fg2) }
.sc-tag.warn{ background:var(--warn-bg); color:var(--warn); box-shadow:inset 0 0 0 1px var(--warn-line) }
.sc-tag.bad{ background:var(--bad-bg); color:var(--bad); box-shadow:inset 0 0 0 1px var(--bad-line) }

/* 上昇率の色見本 */
.sc-legend{ display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; font-size:12px; color:var(--fg2) }
.sc-legend .it{ display:inline-flex; align-items:center; gap:5px; white-space:nowrap }
.sc-ramp{ display:inline-flex; align-items:flex-start; gap:8px }
.sc-ramp > span:first-child{ line-height:12px; padding-top:1px }
.sc-ramp .sw{ display:flex; gap:2px }
.sc-ramp .sw i{ display:block; width:42px; height:12px; border-radius:2px }
.sc-ramp .lb{ display:flex; gap:2px; font-size:10.5px; color:var(--muted); line-height:1.3; margin-top:2px; font-variant-numeric:tabular-nums }
.sc-ramp .lb span{ width:42px; text-align:center; white-space:nowrap }
.sc-rampbox{ display:flex; flex-direction:column; gap:2px }
.b0bg{ background:var(--h1) } .b1bg{ background:var(--h2) } .b2bg{ background:var(--h3) } .b3bg{ background:var(--h4) } .b4bg{ background:var(--h5) }
.hatchbg{ background-color:var(--h3); background-image:repeating-linear-gradient(135deg, var(--hatch) 0 2px, transparent 2px 5px) }

/* ===== 概要の帯 ===== */
.sc-band{ display:grid; grid-template-columns: minmax(0,1fr) minmax(300px, 440px); gap:16px 28px; align-items:center }
@container scan (max-width: 760px){ .sc-band{ grid-template-columns: minmax(0,1fr) } }
.sc-kicker{ margin:0; font-size:12px; font-weight:700; color:var(--muted); letter-spacing:.06em }
.sc-date{ margin:2px 0 4px; font-size:24px; line-height:1.25; font-weight:750 }
.sc-date small{ font-size:14px; font-weight:600; color:var(--muted); margin-left:6px }
.sc-meta{ display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center; color:var(--fg2); font-size:13px }
.sc-meta .dot{ color:var(--line2) }
.sc-funnel{ display:grid; grid-template-columns: auto minmax(0,1fr) auto; gap:5px 10px; align-items:center; font-size:12.5px }
.sc-funnel .lb{ color:var(--fg2); white-space:nowrap }
.sc-funnel .tr{ height:8px; border-radius:4px; background:var(--soft); overflow:hidden }
.sc-funnel .tr i{ display:block; height:100%; border-radius:0 4px 4px 0 }
.sc-funnel .v{ font-size:15px; font-weight:700; text-align:right; min-width:2.6em }
.sc-funnel .f0 i{ background:var(--line2) } .sc-funnel .f1 i{ background:var(--muted) } .sc-funnel .f2 i{ background:var(--fg) }
.sc-funnel .ft{ grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:4px 12px; color:var(--muted); font-size:12px; margin-top:2px }
.sc-funnel .ft a{ color:var(--fg2); text-underline-offset:2px }
.sc-warns{ display:flex; flex-direction:column; gap:8px; margin-top:14px }
.sc-warn{ display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border-radius:10px; background:var(--warn-bg); border:1px solid var(--warn-line); color:var(--fg); font-size:13.5px }
.sc-warn .ic{ color:var(--warn); margin-top:2px }
.sc-warn b{ color:var(--warn); margin-right:6px }

/* 絞り込み中の帯 */
.sc-selbar{ position:sticky; top:0; z-index:30; margin:0; padding:8px 16px; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-bottom:1px solid var(--line) }
.sc-selbar[hidden]{ display:none }
.sc-selbar .in{ max-width:1100px; margin:0 auto; display:flex; align-items:center; gap:10px; flex-wrap:wrap }
.sc-selbar .lb{ font-size:12px; color:var(--muted); font-weight:700 }
.sc-selbar .path{ font-weight:700; font-size:14px; min-width:0; display:flex; align-items:center; gap:4px; flex-wrap:wrap }
.sc-selbar .path .ic{ color:var(--muted) }
.sc-selbar .cnt{ font-size:12.5px; color:var(--fg2) }
.sc-selbar .sp{ flex:1 }
@container scan (max-width: 520px){ .sc-selbar{ padding:6px 10px } .sc-selbar .in{ gap:4px 10px } }

/* ===== 散布図 ===== */
.sp-wrap{ position:relative }
.sp-svg{ display:block; width:100%; height:auto; touch-action:manipulation; user-select:none; -webkit-user-select:none }
.sp-svg .grid line{ stroke:var(--line); stroke-width:1 }
.sp-svg .ax text{ fill:var(--muted); font-size:11px; font-variant-numeric:tabular-nums }
.sp-svg .ax .ttl{ fill:var(--fg2); font-size:11.5px; font-weight:600 }
.sp-svg .thr line{ stroke:var(--fg2); stroke-width:1.2; stroke-dasharray:5 4; opacity:.75 }
.sp-svg .thr text{ fill:var(--fg2); font-size:10.5px; font-weight:600; paint-order:stroke; stroke:var(--surface); stroke-width:3px; stroke-linejoin:round }
.sp-svg .pt{ transition:opacity .15s }
.sp-svg .pt.c{ stroke-width:1.25 }
.sp-svg .pt.c.b0{ fill:var(--h1); stroke:var(--e1) } .sp-svg .pt.c.b1{ fill:var(--h2); stroke:var(--e2) }
.sp-svg .pt.c.b2{ fill:var(--h3); stroke:var(--e3) } .sp-svg .pt.c.b3{ fill:var(--h4); stroke:var(--e4) }
.sp-svg .pt.c.b4{ fill:var(--h5); stroke:var(--e5) }
.sp-svg .pt.x{ fill:none; stroke:var(--ex); stroke-width:1.3; opacity:.72 }
.sp-svg .pt.dim, .sp-svg .smk.dim{ opacity:.09 }
.sp-svg .smk{ font-size:9.5px; font-weight:800; fill:var(--fg); paint-order:stroke; stroke:var(--surface); stroke-width:2.6px; stroke-linejoin:round; pointer-events:none }
.sp-svg .lbl{ font-size:11px; font-weight:600; fill:var(--fg); paint-order:stroke; stroke:var(--surface); stroke-width:3.2px; stroke-linejoin:round; pointer-events:none }
.sp-svg .hov{ fill:none; stroke:var(--fg); stroke-width:1.5; pointer-events:none }
.sp-svg .onr{ fill:none; stroke:var(--accent); stroke-width:2.5; pointer-events:none }
.sp-svg .hit{ fill:transparent; cursor:pointer }
.sp-leg{ display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center; font-size:12px; color:var(--fg2); margin:0 0 10px }
.sp-leg .it{ display:inline-flex; align-items:center; gap:5px; white-space:nowrap }
.sp-leg svg{ display:block; overflow:visible }
.sp-leg .g{ display:inline-flex; gap:12px; flex-wrap:wrap }
.sp-note{ margin:8px 0 0; font-size:12px; color:var(--muted) }

/* 吹き出し */
.sc-tip{ position:fixed; z-index:80; pointer-events:none; max-width:260px; padding:8px 10px; border-radius:10px; background:var(--surface); border:1px solid var(--line2); box-shadow:var(--shadow); font-size:12px; line-height:1.45 }
.sc-tip[hidden]{ display:none }
.sc-tip .t{ font-weight:700; font-size:13px }
.sc-tip .m{ color:var(--muted) }
.sc-tip .r{ display:flex; gap:10px; flex-wrap:wrap; margin-top:3px; font-variant-numeric:tabular-nums }
.sc-tip .r b{ font-size:13px }

/* ===== 銘柄カード ===== */
.cd-layer{ position:fixed; inset:0; z-index:60; pointer-events:none }
.cd-layer[hidden]{ display:none }
.cd-scrim{ position:absolute; inset:0; background:rgba(10,10,8,.42); pointer-events:auto }
.cd{ position:absolute; left:0; right:0; bottom:0; max-height:90vh; max-height:90dvh; display:flex; flex-direction:column; background:var(--surface);
  border-radius:16px 16px 0 0; box-shadow:var(--shadow); pointer-events:auto }
.cd-layer.out .cd, .cd-layer.out .cd-scrim{ pointer-events:none }
.cd-grip{ width:40px; height:4px; border-radius:2px; background:var(--line2); margin:8px auto 0; flex:none }
.cd-top{ display:flex; align-items:flex-start; gap:8px; padding:8px 12px 10px 16px; border-bottom:1px solid var(--line); flex:none }
.cd-top .tx{ flex:1; min-width:0 }
.cd-top h2{ margin:0; font-size:18px; line-height:1.35; word-break:break-all }
.cd-top .sub{ display:flex; flex-wrap:wrap; gap:3px 8px; align-items:center; font-size:12.5px; color:var(--fg2); margin-top:2px }
.cd-x{ flex:none; width:44px; height:44px; border:0; border-radius:10px; background:var(--soft); display:grid; place-items:center; cursor:pointer }
.cd-x:hover{ background:var(--soft2) }
.cd-body > *{ flex:none }
.cd-body{ overflow:auto; overscroll-behavior:contain; padding:12px 16px 28px; display:flex; flex-direction:column; gap:18px }
.cd-chips{ display:flex; flex-wrap:wrap; gap:6px; align-items:center }
.cd-chips .lb{ font-size:11.5px; color:var(--muted); margin-right:2px }
.cd-chip{ min-height:44px; padding:0 12px; border-radius:22px; border:1px solid var(--line2); background:var(--surface); font-size:12.5px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:4px }
.cd-chip:hover{ background:var(--soft) }
.cd-chip small{ color:var(--muted); font-weight:600 }
.cd-kpi{ display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:12px; overflow:hidden }
.cd-kpi > div{ background:var(--surface); padding:9px 12px }
.cd-kpi .k{ font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:5px }
.cd-kpi .v{ font-size:21px; font-weight:700; line-height:1.25; letter-spacing:-.01em }
.cd-kpi .v.sm{ font-size:17px }
.cd-kpi .pts{ background:var(--soft) }
.cd-links{ display:flex; flex-direction:column; gap:8px }
.cd-links .row{ display:grid; grid-template-columns: 1fr 1fr; gap:8px }
.cd-links .sc-btn.ink{ min-height:48px; font-size:15px }
.cd h3{ margin:0 0 8px; font-size:13.5px; display:flex; align-items:center; gap:8px; flex-wrap:wrap }
.cd h3 small{ font-weight:500; color:var(--muted); font-size:12px }
.cd-chart svg{ display:block; width:100%; height:auto }
.cd-chart .gl{ stroke:var(--line); stroke-width:1 }
.cd-chart text{ fill:var(--muted); font-size:10.5px; font-variant-numeric:tabular-nums }
.cd-chart .up{ fill:var(--up); stroke:var(--up) } .cd-chart .dn{ fill:var(--down); stroke:var(--down) }
.cd-chart .vu{ fill:var(--up-v) } .cd-chart .vd{ fill:var(--down-v) }
.cd-chart .vu.t{ fill:var(--up) } .cd-chart .vd.t{ fill:var(--down) }
.cd-chart .td{ fill:var(--soft) }
.cd-chart .tdl{ fill:var(--fg2); font-weight:700 }
.cd-chart .avg{ stroke:var(--fg); stroke-width:1.5 }
.cd-chart .avgl{ fill:var(--fg2); font-weight:600 }
.cd-chart .rt{ fill:var(--fg); font-weight:700; font-size:11px }
.cd-chart .csm{ fill:var(--fg); font-weight:800; font-size:9.5px }
.cd-chart .nob{ fill:var(--fg2); font-size:11px; font-weight:600 }
.cd-ckey{ display:flex; flex-wrap:wrap; gap:4px 12px; font-size:11.5px; color:var(--muted); margin-top:4px }
.cd-ckey i{ display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; vertical-align:0 }
.cd-score .tot{ font-size:26px; font-weight:750; line-height:1 }
.cd-score .tot small{ font-size:13px; font-weight:600; color:var(--muted); margin-left:2px }
.cd-score svg{ display:block; width:100%; height:auto; margin-top:8px }
.cd-score .ax text{ fill:var(--muted); font-size:10px }
.cd-why{ display:flex; flex-wrap:wrap; gap:4px 14px; margin:8px 0 0; padding:0; list-style:none; font-size:12.5px }
.cd-why li{ display:inline-flex; align-items:center; gap:5px; white-space:nowrap }
.cd-why li i{ width:10px; height:10px; border-radius:2px; flex:none }
.cd-why li.z{ color:var(--muted) }
.cd-why li b{ font-variant-numeric:tabular-nums }
.cd-fm .row{ display:flex; flex-wrap:wrap; gap:4px 14px; align-items:baseline; font-size:13px; margin-bottom:8px }
.cd-fm .row b{ font-size:16px }
.cd-mix{ display:flex; height:14px; border-radius:4px; overflow:hidden; gap:2px; background:var(--surface) }
.cd-mix i{ display:block; height:100% }
.cd-mix .c{ background:var(--fg) } .cd-mix .n{ background:var(--line2) }
.cd-mix .h, .cd-mixk i.h{ background-color:var(--hype); background-image:repeating-linear-gradient(135deg, rgba(255,255,255,.4) 0 2px, transparent 2px 5px) }
.cd-mixk{ display:flex; flex-wrap:wrap; gap:4px 14px; font-size:12px; color:var(--fg2); margin-top:6px }
.cd-mixk span{ display:inline-flex; align-items:center; gap:5px }
.cd-mixk i{ width:10px; height:10px; border-radius:2px }
.cd-posts{ display:flex; flex-direction:column; gap:8px; margin:0; padding:0; list-style:none }
.cd-post{ padding:9px 11px; border-radius:10px; border:1px solid var(--line); font-size:13px; line-height:1.6; white-space:pre-line; word-break:break-word; color:var(--fg2) }
.cd-post.c{ background:var(--soft); border-color:var(--line2); color:var(--fg) }
.cd-post .pt{ display:flex; gap:6px; margin-bottom:3px }
.cd-post mark{ background:var(--warn-bg); color:inherit; font-weight:700; box-shadow:inset 0 -2px 0 var(--warn-line); border-radius:2px; padding:0 1px }
.cd-feat{ margin:0; font-size:13.5px; line-height:1.7 }
.cd-ex{ display:flex; flex-direction:column; gap:6px; padding:10px 12px; border-radius:10px; background:var(--soft); font-size:13px }
.cd-ex .t{ font-weight:700; display:flex; align-items:center; gap:6px }
.cd-ex.bad{ background:var(--bad-bg); box-shadow:inset 0 0 0 1px var(--bad-line) }
.cd-ex.bad .t{ color:var(--bad) }
.cd-ex ul{ margin:0; padding-left:18px }
.cd-muted{ font-size:12.5px; color:var(--muted); margin:0 }
@media (min-width: 900px){
  .cd-scrim{ display:none }
  .cd{ left:auto; top:0; right:0; bottom:0; width:440px; max-height:none; border-radius:0; border-left:1px solid var(--line) }
  .cd-grip{ display:none }
  .cd-top{ padding-top:14px }
}
.sp-svg .gh, .sp-svg .gh-ax{ pointer-events:none }

/* ===== 動き =====
 * transform と opacity だけを動かす。最初の表示と押したときだけ（JS がクラスを付ける）。
 * 動きを減らす設定では何も動かさない（下の no-preference の中にだけ書く）。どれも止まった形が最後の形になる */
@keyframes fadeIn{ from{ opacity:0 } }
@keyframes fadeOut{ to{ opacity:0 } }
@keyframes growX{ from{ transform:scaleX(0) } }
@keyframes growY{ from{ transform:scaleY(0); opacity:0 } }
@keyframes ptIn{ from{ transform:scale(0); opacity:0 } }
@keyframes ptDim{ from{ opacity:1 } }
@keyframes ptDimX{ from{ opacity:.72 } }
@keyframes ptLit{ from{ opacity:.09 } }
@keyframes hmIn{ from{ transform:scale(.96); opacity:0 } }
@keyframes zIn{ from{ transform:scale(.9); opacity:0 } }
@keyframes zOut{ from{ transform:scale(1.05); opacity:0 } }
@keyframes tbIn{ from{ opacity:.25 } }
@keyframes cdUp{ from{ transform:translateY(100%) } }
@keyframes cdDown{ to{ transform:translateY(100%) } }
@keyframes cdIn{ from{ transform:translateX(24px); opacity:.6 } }
@keyframes cdOut{ to{ transform:translateX(24px); opacity:0 } }
@keyframes cdSwap{ from{ opacity:.4 } }
@keyframes ckPop{ 0%{ transform:scale(0); opacity:0 } 60%{ transform:scale(1.25); opacity:1 } 100%{ transform:none; opacity:1 } }
@keyframes icPop{ from{ transform:scale(.72) } }
/* ===== 上の案内（サーバーが足す。.scan-root の外なので色は自前で持つ） ===== */
.site-nav{
  display:flex; flex-wrap:wrap; align-items:center; gap:4px 16px;
  max-width:1100px; margin:0 auto; padding:8px 16px; box-sizing:border-box;
  font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  font-size:0.85rem; line-height:1.6; color:#46443f;
}
.site-nav a{ color:#1f5fc4 }
.site-nav a:first-child{ margin-right:auto; color:#1b1a18; font-weight:700; text-decoration:none }
@media (prefers-color-scheme: dark){
  .site-nav{ color:#cfcdc6 }
  .site-nav a{ color:#7aa8ff }
  .site-nav a:first-child{ color:#edece8 }
}


/* ===== review（振り返り）だけの部品 ===== */
/* 成績の色：0% を真ん中に、プラスは赤・マイナスは青（陽線・陰線と同じ向き）。
 * scan の上昇率の赤（--h1〜--h5）とは意味が違うので別の変数。r0 がいちばん負け、r5 がいちばん勝ち。
 * 区切り：−10以下 ／ −10〜−5 ／ −5〜0（ちょうど 0 はここ）／ 0〜+5 ／ +5〜+10 ／ +10以上 */
.scan-root{
  --r0:#1d4f91; --r1:#4a7fc4; --r2:#96b5df; --r3:#f0a493; --r4:#d9583f; --r5:#9e2618;
  --r0e:#123766; --r1e:#2f5e9e; --r2e:#5f89c0; --r3e:#d77b65; --r4e:#b03c26; --r5e:#6e170c;
  --pos-bg:rgba(200,69,47,.07); --neg-bg:rgba(47,99,184,.07); --cap-bg:rgba(27,26,24,.035);
}
@media (prefers-color-scheme: dark){
  .scan-root:not([data-theme="light"]){
    --r0:#a3c4ff; --r1:#5b8fdc; --r2:#3b5f96; --r3:#9a4234; --r4:#e0624a; --r5:#ffa286;
    --r0e:#cfe0ff; --r1e:#8db3ec; --r2e:#5f86c0; --r3e:#c2604f; --r4e:#f38b75; --r5e:#ffc7b5;
    --pos-bg:rgba(240,106,78,.09); --neg-bg:rgba(111,159,240,.09); --cap-bg:rgba(255,255,255,.04);
  }
}
.scan-root[data-theme="dark"]{
  --r0:#a3c4ff; --r1:#5b8fdc; --r2:#3b5f96; --r3:#9a4234; --r4:#e0624a; --r5:#ffa286;
  --r0e:#cfe0ff; --r1e:#8db3ec; --r2e:#5f86c0; --r3e:#c2604f; --r4e:#f38b75; --r5e:#ffc7b5;
  --pos-bg:rgba(240,106,78,.09); --neg-bg:rgba(111,159,240,.09); --cap-bg:rgba(255,255,255,.04);
}
.r0bg{ background:var(--r0) } .r1bg{ background:var(--r1) } .r2bg{ background:var(--r2) }
.r3bg{ background:var(--r3) } .r4bg{ background:var(--r4) } .r5bg{ background:var(--r5) }
.rv .sw{ display:inline-block; width:9px; height:9px; border-radius:2px; flex:none }
.rv .cap-t{ font-weight:600; color:var(--muted); font-size:11px; white-space:nowrap }

/* 点（成績で色分け）。輪郭は同じ色の1段濃い色 */
.rv .d{ stroke-width:1 }
.rv .d.r0{ fill:var(--r0); stroke:var(--r0e) } .rv .d.r1{ fill:var(--r1); stroke:var(--r1e) } .rv .d.r2{ fill:var(--r2); stroke:var(--r2e) }
.rv .d.r3{ fill:var(--r3); stroke:var(--r3e) } .rv .d.r4{ fill:var(--r4); stroke:var(--r4e) } .rv .d.r5{ fill:var(--r5); stroke:var(--r5e) }
.rv .d.dim{ opacity:.1 }
.rv .cap .d{ fill-opacity:.55 }
.rv .hit{ fill:transparent; cursor:pointer }
.rv .hov{ fill:none; stroke:var(--fg); stroke-width:1.5; pointer-events:none }
.rv .onr{ fill:none; stroke:var(--accent); stroke-width:2.5; pointer-events:none }
.rv svg text{ font-variant-numeric:tabular-nums }

/* 色の見本（成績） */
.rv-key{ display:inline-flex; flex-wrap:wrap; align-items:flex-start; gap:4px 8px; font-size:12px; color:var(--fg2); max-width:100% }
.rv-key > span:first-child{ line-height:12px; padding-top:1px; white-space:nowrap }
.rv-key .bx{ display:flex; flex-direction:column; gap:2px; flex:1 1 260px; max-width:300px; min-width:0 }
.rv-key .sws, .rv-key .lbs{ display:flex; gap:2px }
.rv-key .sws i{ display:block; flex:1 1 0; min-width:0; height:12px; border-radius:2px }
.rv-key .sws i:nth-child(3), .rv-key .lbs span:nth-child(3){ margin-right:3px }
.rv-key .lbs{ font-size:10px; color:var(--muted); line-height:1.3; font-variant-numeric:tabular-nums }
.rv-key .lbs span{ flex:1 1 0; min-width:0; text-align:center; white-space:nowrap; letter-spacing:-.03em }

.ls-empty{ padding:24px 12px; text-align:center; color:var(--fg2); background:var(--soft); border-radius:10px; font-weight:600 }
.sp-note{ margin:8px 0 0; font-size:12px; color:var(--muted) }

/* ===== 概要の帯 ===== */
.rv-band{ display:grid; grid-template-columns: minmax(0,1fr) minmax(300px, 460px); gap:14px 28px; align-items:start }
@container scan (max-width: 760px){ .rv-band{ grid-template-columns: minmax(0,1fr) } }
.rv-cnt{ display:flex; flex-direction:column; gap:8px }
.rv-cnt .bar{ display:flex; height:10px; border-radius:5px; overflow:hidden; gap:2px; background:var(--surface) }
.rv-cnt .bar i{ display:block; height:100% }
.rv-cnt .bar .c{ background:var(--fg) } .rv-cnt .bar .x{ background:var(--muted) }
.rv-cnt .bar .p{ background:var(--soft2) } .rv-cnt .bar .f{ background:var(--bad) }
.rv-cnt dl{ display:grid; grid-template-columns: auto auto 1fr; gap:3px 10px; margin:0; font-size:12.5px; align-items:baseline }
.rv-cnt dt{ display:flex; align-items:center; gap:6px; color:var(--fg2); white-space:nowrap }
.rv-cnt dt i{ width:10px; height:10px; border-radius:2px; flex:none }
.rv-cnt dd{ margin:0; font-weight:700; font-size:15px; text-align:right }
.rv-cnt .nt{ color:var(--muted); font-size:12px }
.rv-cnt .bad{ color:var(--bad) }
.rv-rule{ margin:12px 0 0; font-size:12.5px; color:var(--fg2); display:flex; flex-wrap:wrap; gap:2px 14px }
.rv-rule b{ font-weight:700; color:var(--fg) }
.rv-info{ display:flex; gap:10px; align-items:flex-start; margin-top:12px; padding:10px 12px; border-radius:10px; background:var(--soft); font-size:13px; color:var(--fg) }
.rv-info .ic{ color:var(--fg2); margin-top:2px }
.rv-more{ margin-top:10px; border-radius:10px }
.rv-more > summary{ list-style:none; display:flex; align-items:center; gap:8px; min-height:44px; padding:0 10px; border-radius:10px; cursor:pointer; font-size:13px; font-weight:600 }
.rv-more > summary::-webkit-details-marker{ display:none }
.rv-more > summary .chev{ color:var(--muted); transition:transform .15s }
.rv-more[open] > summary .chev{ transform:rotate(90deg) }
.rv-more.warn{ background:var(--warn-bg); border:1px solid var(--warn-line) }
.rv-more.warn > summary .ic:first-child{ color:var(--warn) }
.rv-more.warn > summary b{ color:var(--warn) }
.rv-more.help{ border:1px solid var(--line) }
.rv-more .in{ padding:0 12px 12px; font-size:12.5px; color:var(--fg2) }
.rv-wlist{ margin:0; padding-left:18px; display:flex; flex-direction:column; gap:6px }
.rv-wlist li{ overflow-wrap:anywhere; word-break:break-word; line-height:1.5 }
.rv-gl{ display:grid; grid-template-columns: max-content minmax(0,1fr); gap:6px 14px; margin:0 }
.rv-gl dt{ font-weight:700; color:var(--fg); white-space:nowrap }
.rv-gl dd{ margin:0 }
@container scan (max-width: 520px){ .rv-gl{ grid-template-columns: minmax(0,1fr); gap:2px } .rv-gl dd{ margin-bottom:6px } }

/* ===== 切り替え ===== */
.rv-tools{ display:flex; flex-wrap:wrap; gap:10px 22px; align-items:center }
.rv-tools .grp{ display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; min-width:0; max-width:100% }
.rv-tools .lb{ font-size:12.5px; font-weight:700; color:var(--fg2); white-space:nowrap }
.rv-tools .nt{ font-size:12px; color:var(--muted); flex-basis:100% }
.rv-sell button .cap-t{ margin-left:4px }
@container scan (max-width: 520px){
  .rv-tools .grp{ width:100% }
  .rv-tools .sc-seg{ width:100%; display:grid; grid-template-columns: repeat(3, minmax(0,1fr)) }
  .rv-tools .sc-seg button{ padding:0 6px; white-space:normal; line-height:1.2; font-size:12.5px }
  .rv-sell button .cap-t{ display:block; margin:1px 0 0 }
}
.rv-hseg{ display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px }
.rv-hseg .sc-seg button{ min-height:40px; padding:0 10px; font-size:12px }
@container scan (max-width: 520px){ .rv-hseg{ width:100% } .rv-hseg .sc-seg{ width:100%; display:grid; grid-template-columns: repeat(3, minmax(0,1fr)) } }

/* ===== 候補を買っていたら ===== */
.rv-tiles{ display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:12px }
@container scan (max-width: 760px){ .rv-tiles{ grid-template-columns: minmax(0,1fr) } }
.rv-tile{ border:1px solid var(--line); border-radius:12px; padding:12px 12px 8px; min-width:0; display:flex; flex-direction:column; gap:6px }
.rv-tile.on{ box-shadow:inset 0 0 0 2px var(--fg); border-color:transparent }
.rv-tile.cap{ border-style:dashed; border-color:var(--line2); background:var(--cap-bg) }
.rv-tile.cap.on{ box-shadow:none; border:2px dashed var(--fg) }
.rv-tile .hd{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:13px; font-weight:700 }
.rv-tile .hd .sel{ margin-left:auto; font-size:11px; font-weight:700; color:var(--fg2) }
.rv-tile .big{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap }
.rv-tile .big b{ font-size:30px; line-height:1.1; font-weight:750; letter-spacing:-.01em }
.rv-tile .big .sw{ width:12px; height:12px; align-self:center }
.rv-tile .meta{ display:flex; flex-wrap:wrap; gap:2px 12px; font-size:12.5px; color:var(--fg2) }
.rv-tile .meta b{ color:var(--fg) }
.rv-tile .cmp{ font-size:12px; color:var(--muted) }
.rv-tile .capn{ font-size:12px; font-weight:700; color:var(--fg2); display:flex; align-items:center; gap:5px }
.rv-sumkey{ display:flex; flex-wrap:wrap; gap:6px 18px; align-items:center; margin-top:12px }

/* 1件ずつの点の並び */
.rv-strip{ display:block; width:100%; height:auto; touch-action:manipulation; user-select:none; -webkit-user-select:none; overflow:visible }
.rv-strip .zl{ stroke:var(--fg2); stroke-width:1.2 }
.rv-strip .gl{ stroke:var(--line); stroke-width:1 }
.rv-strip .tk{ fill:var(--muted); font-size:10px }
.rv-strip .avg{ stroke:var(--fg); stroke-width:2 }
.rv-strip .avgm{ fill:var(--fg) }
.rv-strip .avgt{ fill:var(--fg); font-size:10.5px; font-weight:700 }
.rv-strip .ref{ stroke:var(--fg2); stroke-width:1.2; stroke-dasharray:3 3; opacity:.7 }
.rv-strip .reft{ fill:var(--muted); font-size:10px }
.rv-strip .clip{ fill:var(--fg2); font-size:10px; font-weight:700 }
.rv-strip .neg{ fill:var(--neg-bg) } .rv-strip .pos{ fill:var(--pos-bg) }

/* ===== 点数と成績の散布図 ===== */
.rv-sp .zl{ stroke:var(--fg); stroke-width:1.3 }
.rv-sp .bd{ stroke:var(--fg2); stroke-width:1; stroke-dasharray:3 4; opacity:.7 }
.rv-sp .bm{ stroke:var(--fg); stroke-width:2.5; stroke-linecap:round }
.rv-sp .bmh{ stroke:var(--surface); stroke-width:6; stroke-linecap:round; opacity:.9 }
.rv-sp .bml{ fill:var(--fg); font-size:11px; font-weight:700; paint-order:stroke; stroke:var(--surface); stroke-width:3px; stroke-linejoin:round }
.rv-sp .bc{ fill:var(--fg2); font-size:11px; font-weight:600 }
.rv-sp .neg{ fill:var(--neg-bg) } .rv-sp .pos{ fill:var(--pos-bg) }
.rv-sp .clipm{ fill:var(--fg2) }
.rv-sp .clipt{ fill:var(--fg2); font-size:10.5px; font-weight:700; paint-order:stroke; stroke:var(--surface); stroke-width:3px }
.rv-cap-note{ display:flex; align-items:center; gap:6px; margin:0 0 8px; padding:6px 10px; border:1px dashed var(--line2); border-radius:8px; font-size:12.5px; color:var(--fg2); background:var(--cap-bg) }
.rv-bands{ display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap:6px; margin-top:10px }
@container scan (max-width: 620px){ .rv-bands{ grid-template-columns: repeat(2, minmax(0,1fr)) } }
.rv-band-b{ display:flex; flex-direction:column; align-items:flex-start; gap:1px; min-height:44px; padding:7px 10px; border:1px solid var(--line); border-radius:10px; background:var(--surface); text-align:left; cursor:pointer; min-width:0 }
.rv-band-b:hover{ background:var(--soft) }
.rv-band-b[aria-pressed="true"]{ box-shadow:inset 0 0 0 2px var(--fg); border-color:transparent }
.rv-band-b .t{ font-size:12px; font-weight:700; color:var(--fg2) }
.rv-band-b .v{ font-size:15px; font-weight:700; display:flex; align-items:center; gap:5px }
.rv-band-b .m{ font-size:11.5px; color:var(--muted) }
.rv-band-b.few{ opacity:.55 }

/* ===== 加点の効き目・ルートと除外（ダンベル） ===== */
.db-key{ display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center; font-size:12px; color:var(--fg2); margin:0 0 10px }
.db-key .it{ display:inline-flex; align-items:center; gap:5px; white-space:nowrap }
.db-list{ display:flex; flex-direction:column }
.db{ border-top:1px solid var(--line); padding:12px 0 10px; display:grid; gap:8px 18px; grid-template-columns: 168px minmax(0,1fr) minmax(0,1fr); align-items:start }
.db:first-child{ border-top:0; padding-top:4px }
.db .nm{ display:flex; flex-direction:column; gap:3px; min-width:0; padding-top:2px }
.db .nm b{ font-size:14px; display:flex; align-items:center; gap:7px }
.db .nm b i{ width:12px; height:12px; border-radius:3px; flex:none }
.db .nm small{ font-size:11.5px; color:var(--muted); line-height:1.4 }
.db .pn{ min-width:0 }
.db .pn .t{ display:flex; justify-content:space-between; gap:6px; font-size:11.5px; color:var(--muted); margin-bottom:2px }
.db .pn .t b{ color:var(--fg); font-size:12.5px; white-space:nowrap }
.db .pn svg{ display:block; width:100%; height:auto; overflow:visible }
.db .act{ grid-column:2 / -1; display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center }
.db .ex{ grid-column:1 / -1 }
@container scan (max-width: 760px){
  .db{ grid-template-columns: minmax(0,1fr) }
  .db .act{ grid-column:1 }
}
.db-b{ display:inline-flex; align-items:center; gap:7px; min-height:44px; padding:4px 12px; border:1px solid var(--line2); border-radius:10px; background:var(--surface); cursor:pointer; font-size:12.5px; text-align:left; max-width:100% }
.db-b:hover{ background:var(--soft) }
.db-b[aria-pressed="true"]{ background:var(--btn-bg); color:var(--btn-fg); border-color:var(--btn-bg) }
.db-b[aria-pressed="true"] .mk circle{ stroke:var(--btn-fg) }
.db-b[aria-pressed="true"] .mk .fill{ fill:var(--btn-fg) }
.db-b > span{ white-space:nowrap }
.db-b .v{ font-weight:700; white-space:nowrap }
.db-b .n{ color:inherit; opacity:.75; white-space:nowrap }
.db-b.few .v, .db-b.few .n{ opacity:.6 }
.db-b .mk{ flex:none; display:block }
.db-b .mk circle{ stroke:var(--fg); stroke-width:2 }
.db-b .mk .fill{ fill:var(--fg) } .db-b .mk .hol{ fill:none }
.db-x{ display:inline-flex; align-items:center; gap:4px; min-height:44px; padding:0 10px; border:0; border-radius:10px; background:transparent; color:var(--fg2); font-size:12.5px; font-weight:600; cursor:pointer }
.db-x:hover{ background:var(--soft) }
.db-x .ic{ transition:transform .15s }
.db-x[aria-expanded="true"] .ic{ transform:rotate(90deg) }
.db-few{ font-size:11px; font-weight:700; color:var(--fg2); background:var(--soft2); border-radius:6px; padding:1px 6px; white-space:nowrap }
.db-svg .ax{ stroke:var(--line2); stroke-width:1 }
.db-svg .zl{ stroke:var(--fg2); stroke-width:1.2 }
.db-svg .ref{ stroke:var(--fg2); stroke-width:1.2; stroke-dasharray:3 3; opacity:.8 }
.db-svg .half{ stroke:var(--fg2); stroke-width:1.2 }
.db-svg .tk{ fill:var(--muted); font-size:10px }
.db-svg .lnk{ stroke:var(--fg); stroke-width:2.5; stroke-linecap:round; opacity:.55 }
.db-svg .mw{ fill:var(--fg); stroke:var(--surface); stroke-width:2 }
.db-svg .mo{ fill:var(--surface); stroke:var(--fg); stroke-width:2.2 }
.db-svg .few{ opacity:.35 }
.db-svg .neg{ fill:var(--neg-bg) } .db-svg .pos{ fill:var(--pos-bg) }
.db-strips{ display:flex; flex-direction:column; gap:8px; padding:10px 12px; border-radius:10px; background:var(--soft) }
.db-strips .lb{ font-size:12px; font-weight:700; color:var(--fg2); display:flex; align-items:center; gap:6px }
.db-sec-t{ display:flex; flex-wrap:wrap; gap:2px 10px; align-items:baseline; margin:16px 0 4px }
.db-sec-t h3{ margin:0; font-size:14px }
.db-sec-t span{ font-size:12px; color:var(--muted) }
.db-sec-t:first-child{ margin-top:0 }

/* ===== 日ごとの成績 ===== */
.dy-list{ display:flex; flex-direction:column }
.dy{ position:relative; display:grid; grid-template-columns: 150px 200px minmax(0,1fr); gap:6px 16px; align-items:center; padding:10px 6px; border-top:1px solid var(--line); text-align:left; width:100%; background:transparent; border-left:0; border-right:0; border-bottom:0; cursor:pointer; font:inherit; color:inherit }
.dy:first-child{ border-top:0 }
.dy:hover{ background:var(--soft) }
.dy[aria-pressed="true"]{ background:var(--soft); box-shadow:inset 3px 0 0 var(--accent) }
.dy.wait{ cursor:default }
.dy.wait:hover{ background:transparent }
.dy .dt b{ display:block; font-size:14px }
.dy .dt small{ color:var(--muted); font-size:11.5px }
.dy .st{ display:flex; flex-wrap:wrap; gap:2px 12px; font-size:12.5px; color:var(--fg2) }

@container scan (max-width: 760px){
  .dy{ grid-template-columns: minmax(0,1fr); gap:4px }
  .dy .dt{ display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 8px }

  .dy .sv, .dy .wt{ grid-column:1 }
}

.dy-cols .gl{ stroke:var(--line); stroke-width:1 }

.dy-cols .col{ cursor:pointer }
.dy-cols .col.dim{ opacity:.25 }
.dy-cols .col.sel{ stroke:var(--fg); stroke-width:2 }

/* ===== 銘柄ごとの一覧 ===== */
.ol-ctrl{ display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center }
.ol-ctrl .lb{ font-size:12.5px; color:var(--fg2); font-weight:700 }
.ol-ctrl .grp{ display:flex; align-items:center; gap:6px 8px; flex-wrap:wrap }
@container scan (max-width: 520px){
  .ol-ctrl, .ol-ctrl .sc-seg{ width:100% }
  .ol-ctrl .sc-seg{ display:grid; grid-template-columns: repeat(3, minmax(0,1fr)) }
  .ol-ctrl .sc-seg + .sc-seg{ grid-template-columns: repeat(4, minmax(0,1fr)) }
  .ol-ctrl .sc-seg button{ padding:0 4px; white-space:normal; line-height:1.2; font-size:12.5px }
}
.ol-filt{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12.5px; color:var(--fg2); margin:-2px 0 10px }
.ol-th{ display:none }
.ol{ display:flex; flex-direction:column }
.or{ position:relative; display:grid; gap:4px 12px; align-items:center; padding:9px 6px; border-top:1px solid var(--line);
  grid-template-columns: minmax(0,1fr) auto; grid-template-areas: "nm fl" "rt rt" "ck tg" }
.or:first-child{ border-top:0 }
.or:hover{ background:var(--soft) }
.or.on{ background:var(--soft); box-shadow:inset 3px 0 0 var(--accent) }
.or > *{ position:relative; z-index:1; pointer-events:none; min-width:0 }
.or .hit{ position:absolute; inset:0; z-index:0; pointer-events:auto; border:0; background:transparent; cursor:pointer; border-radius:0 }
.or .fl{ grid-area:fl; pointer-events:auto; z-index:2; justify-self:end }
.or .nm{ grid-area:nm; display:flex; flex-direction:column; min-width:0 }

/* ===== 動き（scan と同じ決まり：transform と opacity だけ。動きを減らす設定では動かさない） ===== */
@media (prefers-reduced-motion: no-preference){

      var x0 = padL + (slots - n) * sw;
      var cx = function (i) { return x0 + sw * i + sw / 2; };
      var lo = Infinity, hi = -Infinity, vmax = 0;
      seq.forEach(function (b) { lo = Math.min(lo, b[3]); hi = Math.max(hi, b[2]); vmax = Math.max(vmax, b[5]); });
      if (o.entry != null) { lo = Math.min(lo, o.entry); hi = Math.max(hi, o.entry); }
      var pad = (hi - lo) * 0.08 || hi * 0.02 || 1; lo -= pad; hi += pad * 1.6;
      var Y = function (v) { return top + ph - (v - lo) / (hi - lo) * ph; };

      var g = sv('svg', { width: Wc, height: Hc, viewBox: '0 0 ' + Wc + ' ' + Hc, role: 'img',
        'aria-label': 'ローソク足。scan の日の前 ' + (sp.sd ? nPre - 1 : nPre) + '本と、その後 ' + sp.post.length + '本' });
      var tk = (function () { var span = hi - lo, st2 = Math.pow(10, Math.floor(Math.log10(span / 4))), e = span / 4 / st2; if (e >= 7.5) st2 *= 10; else if (e >= 3.5) st2 *= 5; else if (e >= 1.5) st2 *= 2; var out = []; for (var t = Math.ceil(lo / st2) * st2; t <= hi; t += st2) out.push(t); return { t: out, d: st2 >= 1 ? 0 : 1 }; })();
      tk.t.forEach(function (t) {
        add(g, sv('line', { class: 'gl', x1: padL, x2: Wc - padR + 4, y1: Y(t), y2: Y(t) }));
        add(g, sv('text', { x: Wc - padR + 8, y: Y(t) + 4, text: nf(t, tk.d) }));
      });
      add(g, sv('line', { class: 'gl', x1: padL, x2: Wc - padR + 4, y1: vb, y2: vb }));
      if (sp.post.length) add(g, sv('rect', { class: 'af', x: cx(nPre) - sw / 2, y: top - 26, width: sw * sp.post.length, height: vb - top + 26 }));
      // 名前の置き場所：置いた名前の箱を覚えておき、重なるときは次の候補の場所に置く
      var taken = [];
      function tbox(x, y, w) { return { x0: x - 2, x1: x + w + 2, y0: y - 10, y1: y + 3 }; }
      function hits(b) { return taken.some(function (t) { return b.x0 < t.x1 && t.x0 < b.x1 && b.y0 < t.y1 && t.y0 < b.y1; }); }
      function place(cands, w) {
        for (var i = 0; i < cands.length; i++) {
          var c = cands[i], b = tbox(c[0], c[1], w);
          if (c[0] < padL || c[0] + w > Wc - 2 || b.y0 < 0 || b.y1 > vb) continue;
          if (!hits(b)) { taken.push(b); return c; }
        }
        taken.push(tbox(cands[0][0], cands[0][1], w));
        return cands[0];
      }
      function label(cls, x, y, text, anchor) {
        var w = textW(text, 10.5, 700), lx = anchor === 'middle' ? x - w / 2 : x;
        taken.push(tbox(lx, y, w));
        add(g, sv('text', { class: cls, x: x, y: y, 'text-anchor': anchor || null, text: text }));
      }
      // 足の幅が狭いときは、名前を上下にずらして重ならないようにする
      var tight = sw < 36;
      if (sp.sd) {
        add(g, sv('rect', { class: 'td', x: cx(nPre - 1) - sw / 2, y: top - 26, width: sw, height: vb - top + 26 }));
        label('tdl', cx(nPre - 1), tight ? top - 4 : top - 14, 'scan', 'middle');
      }
      sp.post.forEach(function (b, i) { label('dl', cx(nPre + i), tight && i ? top - 4 : top - 16, i ? '2日目' : '1日目', 'middle'); });
      seq.forEach(function (b, i) {
        var op = b[1], hg = b[2], l = b[3], c = b[4], up = c >= op, x = cx(i), cls = up ? 'up' : 'dn';
        var dl = 'calc(var(--gd, 0ms) + ' + Math.round(i / Math.max(1, n - 1) * 160) + 'ms)';
        var cg = sv('g', { class: 'gy', style: { 'transform-origin': x.toFixed(1) + 'px ' + Y(op).toFixed(1) + 'px', 'animation-delay': dl } });
        add(cg, sv('line', { class: cls, x1: x, x2: x, y1: Y(hg), y2: Y(l), 'stroke-width': 1 }));
        var y1 = Y(Math.max(op, c)), y2 = Y(Math.min(op, c));
        add(cg, sv('rect', { class: cls, x: x - bw / 2, y: y1, width: bw, height: Math.max(1, y2 - y1), 'stroke-width': 0 }));
        add(g, cg);
        add(g, sv('rect', { class: (up ? 'vu' : 'vd') + (i >= nPre ? ' t' : '') + ' gy', x: x - bw / 2, y: V(b[5]), width: bw, height: Math.max(0.5, vb - V(b[5])),
          style: { 'transform-origin': x.toFixed(1) + 'px ' + vb + 'px', 'animation-delay': dl } }));
      });
      // 最高値の印と買値の線（1日目の始値から右へ）。名前は先に最高値、次に買値を置き、近いときはずらす
      var mi = -1, xe = sp.post.length ? cx(nPre) - bw / 2 - 2 : 0;
      if (o.max_high != null && sp.post.length) sp.post.forEach(function (b, i) { if (mi < 0 && b[2] >= o.max_high - 1e-9) mi = i; });
      if (mi >= 0) {
        var mx = cx(nPre + mi), my = Y(o.max_high);
        add(g, sv('path', { class: 'mxm', d: 'M' + (mx - 4.5) + ' ' + (my - 9) + 'l9 0l-4.5 6z' }));
        var ml = '最高値 ' + fmt.yen(o.max_high), mlw = textW(ml, 10.5, 700);
        var mp = place([[mx - 8 - mlw, my - 4], [mx - 8 - mlw, my + 10], [mx + 8, my - 4], [mx - 8 - mlw, my - 18]], mlw);
        add(g, sv('text', { class: 'mxl', x: mp[0], y: mp[1], text: ml }));
      }
      if (o.entry != null && sp.post.length) {
        var ye = Y(o.entry);
        add(g, sv('line', { class: 'ent', x1: xe, x2: Wc - padR + 4, y1: ye, y2: ye }));
        var el = '買値 ' + fmt.yen(o.entry), elw = textW(el, 10.5, 700), ex0 = Math.max(padL + 2, xe - elw - 6);
        var ep = place([[ex0, ye + 4], [ex0, ye + 16], [ex0, ye - 8], [ex0, ye + 28]], elw);
        add(g, sv('text', { class: 'entl', x: ep[0], y: ep[1], text: el }));
      }
      add(g, sv('text', { x: Wc - padR + 8, y: vb - 2, text: '出来高' }));
      // 日付：最初と最後の足の下。近くて重なるときは最後だけ
      var dl0 = seq[0] ? md(seq[0][0]) : '', dl1 = n > 1 ? md(seq[n - 1][0]) : '';
      var w0 = textW(dl0, 10.5, 400), w1 = textW(dl1, 10.5, 400);
      var x0d = clamp(cx(0) - w0 / 2, padL, Wc - padR - w0), x1d = clamp(cx(n - 1) - w1 / 2, padL, Wc - padR - w1);
      if (dl0 && (!dl1 || x0d + w0 + 8 <= x1d)) add(g, sv('text', { x: x0d, y: Hc - 4, text: dl0 }));
      if (dl1) add(g, sv('text', { x: x1d, y: Hc - 4, text: dl1 }));
      return g;
    }

    /* =========================== 状態の変更 =========================== */
    function anchorOf(key) {
      if (!key) return null;
      var els = root.querySelectorAll('[data-anchor]');
      for (var i = 0; i < els.length; i++) if (els[i].getAttribute('data-anchor') === key) return els[i];
      return null;
    }
    // 押して描き直すときは、押した部品を指の下に保つ（scan の act と同じ。overflow-anchor は CSS で切っている）。
    // 部品がなくなったら、押した部品があった欄の上端を元の位置に保つ
    function act(kind, trigger, fn) {
      var key = trigger ? trigger.getAttribute('data-anchor') : null;
      var t0 = key ? trigger.getBoundingClientRect().top : 0;
      var sec = trigger && trigger.closest ? trigger.closest('section') : null, s0 = sec ? sec.getBoundingClientRect().top : 0;
      var focused = !!(trigger && trigger.contains(document.activeElement));
      mo = calm() ? null : kind;
      after = [];
      var jobs;
      try { fn(); } finally { jobs = after; after = []; mo = null; }
      var again = anchorOf(key), dy = 0;
      if (again) dy = again.getBoundingClientRect().top - t0;
      else if (sec && document.contains(sec)) dy = sec.getBoundingClientRect().top - s0;
      if (trigger && Math.abs(dy) >= 1) global.scrollBy(0, dy);
      if (again && focused) again.focus({ preventScroll: true });
      jobs.forEach(function (job) { try { job(); } catch (e) { if (global.console) global.console.warn('review: 動きを付けられませんでした', e); } });
      return again;
    }
    function renderAll() {
      hideTip();
      // まだ結果が1件もないときは、概要・結論の帯（案内）・日ごと（結果待ちの回）だけを出す
      var none = !M.resultDays.length;
      [secTools, secSp, secDb, secRt, secLs].forEach(function (s) { s.hidden = none; });
      renderBand(); renderTools(); renderSelbar(); renderSum(); renderScatter(); renderDb(); renderRt(); renderDays(); renderList(); markOn();
    }
    function renderCharts() { renderSum(); renderScatter(); renderDb(); renderRt(); renderDays(); markOn(); }
    function setSell(k, trigger) {
      act('sell', trigger, function () { st.sell = k; savePref(SELL_KEY, k); renderTools(); renderSelbar(); renderCharts(); renderList(); });
    }
    function setPeriod(k, trigger) {
      act('period', trigger, function () {
        st.period = k; savePref(PERIOD_KEY, k); recompute();
        if (st.pick && st.pick.kind === 'day' && days.indexOf(st.pick.key) < 0) st.pick = null;
        st.limit = PAGE; renderAll();
      });
    }
    function pick(p, trigger) {
      act('pick', trigger, function () {
        st.pick = p;
        // 除外の組を選んだら一覧を「除外」に、候補の組なら「候補」にそろえる（「すべて」はそのまま）
        if (p && (p.kind === 'excluded' || p.kind === 'exAll') && st.list === 'cand') st.list = 'ex';
        else if (p && p.kind !== 'day' && p.kind !== 'excluded' && p.kind !== 'exAll' && st.list === 'ex') st.list = 'cand';
        st.limit = PAGE;
        renderSelbar(); renderCharts(); renderList();
      });
    }
    function onKey(e) { if (e.key === 'Escape' && st.card != null) closeCard(); }
    document.addEventListener('keydown', onKey);

    // 初めの状態（アドレスの # から）
    recompute();
    if (opts.group) {
      var gp = String(opts.group).split(':'), g0 = null;
      if (gp[0] === 'bonus') g0 = { kind: 'bonus', key: gp[1], side: gp[2] === 'with' ? 'with' : 'without' };
      else if (gp[0] === 'route' || gp[0] === 'excluded' || gp[0] === 'band' || gp[0] === 'day') g0 = { kind: gp[0], key: gp.slice(1).join(':') };
      else if (gp[0] === 'exAll') g0 = { kind: 'exAll' };
      if (g0) { st.pick = g0; if ((g0.kind === 'excluded' || g0.kind === 'exAll') && st.list === 'cand') st.list = 'ex'; }
    }
    act('load', null, renderAll);
    W = root.clientWidth;
    var raf = 0;
    var ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(function () {
      var w = root.clientWidth;
      if (Math.abs(w - W) < 2) return;
      W = w; cancelAnimationFrame(raf);
      raf = requestAnimationFrame(function () { renderCharts(); if (st.card != null) renderCard(true); });
    }) : null;
    if (ro) ro.observe(root);
    if (opts.card) {
      var cc = String(opts.card).split('@');
      var co = M.outs.filter(function (o) { return o.code === cc[0] && (!cc[1] || o.market_date === cc[1]) && o.status !== 'failed'; })
        .sort(function (a, b) { return (b.counted - a.counted) || (a.market_date < b.market_date ? 1 : -1); })[0];
      if (co) openCard(co, null, true);

    return {
      destroy: function () { if (ro) ro.disconnect(); document.removeEventListener('keydown', onKey); closing++; lockScroll(false); host.textContent = ''; },
      pick: pick
    };
  }

  global.ReviewScreen = { mount: mount, verify: verify };
})(typeof window !== 'undefined' ? window : this);

/* ---------- 起動（script は1つにまとめる。アドレスの # で初めの状態を開ける） ---------- */
(function () {
  var app = document.getElementById('app'), el = document.getElementById('review-data');
  if (!app || !el) return;
  var q = {};
  location.hash.replace(/^#/, '').split('&').forEach(function (kv) {
    if (!kv) return;
    var i = kv.indexOf('='), k = i < 0 ? kv : kv.slice(0, i), v = i < 0 ? '' : kv.slice(i + 1);
    try { q[decodeURIComponent(k)] = decodeURIComponent(v); } catch (e) { q[k] = v; }
  });
  if (q.theme === 'dark') document.documentElement.style.background = document.body.style.background = '#111110';
  if (q.theme === 'light') document.documentElement.style.background = document.body.style.background = '#f4f3ef';
  var data = JSON.parse(el.textContent);
  ReviewScreen.mount(app, data, { theme: q.theme, sell: q.sell, period: q.period, group: q.group, card: q.card, list: q.list, open: q.open });
  window.addEventListener('hashchange', function () { location.reload(); });
})();
